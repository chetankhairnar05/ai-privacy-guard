<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Privacy Playground</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      body {
        background-color: #121212;
        color: #fff;
        padding: 30px;
        font-family: sans-serif;
      }
      .container {
        max-width: 850px;
        margin: auto;
      }
      .box {
        background: #1e1e24;
        padding: 20px;
        border-radius: 8px;
        margin-bottom: 20px;
      }
      textarea {
        width: 100%;
        height: 120px;
        background: #2a2a35;
        color: #fff;
        border: none;
        padding: 10px;
        box-sizing: border-box;
      }
      .item-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: #292933;
        padding: 10px 14px;
        margin-bottom: 8px;
        border-radius: 5px;
      }
      .item-row input[type="text"] {
        background: #121212;
        color: #fff;
        border: 1px solid #555;
        padding: 6px;
        border-radius: 4px;
      }
      button {
        background: #0084ff;
        color: white;
        border: none;
        padding: 10px 20px;
        cursor: pointer;
        border-radius: 5px;
        font-weight: bold;
      }
      .badge {
        background: #ff4d4d;
        padding: 3px 8px;
        border-radius: 4px;
        font-size: 11px;
        margin-right: 6px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2 id="playground-title">Privacy Playground</h2>

      <div class="box">
        <h3 id="section-heading">Detected Sensitive Data</h3>
        <div id="items-list">
          <!-- JS generates rows here -->
        </div>
      </div>

      <!-- Container for Text Prompts -->
      <div class="box" id="text-mode-container" style="display: none">
        <h3>Sanitized Prompt Preview</h3>
        <textarea id="output-box" readonly></textarea>
        <br /><br />
        <button id="copy-btn">Copy Sanitized Prompt</button>
      </div>

      <!-- Container for Files (.docx / .pptx) -->
      <div class="box" id="file-mode-container" style="display: none">
        <h3>Document Masking Actions</h3>
        <p id="file-info" style="color: #aaa; font-size: 13px"></p>
        <button id="download-masked-btn">
          Apply Masks & Download Safe Document
        </button>
      </div>
    </div>

    <script src="playground.js"></script>
  </body>
</html>
